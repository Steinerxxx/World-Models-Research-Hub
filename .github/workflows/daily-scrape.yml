name: Daily Paper Scrape

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Scrape Endpoint
        run: |
          # Use secret for backend URL to avoid hardcoding and handle migrations
          BACKEND_URL="${{ secrets.BACKEND_URL }}"
          if [ -z "$BACKEND_URL" ]; then
            echo "⚠️ BACKEND_URL secret is not set. Skipping external trigger."
            echo "Note: The backend has an internal cron job that runs independently."
            exit 0
          fi
          curl -X POST "${BACKEND_URL}/api/scrape"
