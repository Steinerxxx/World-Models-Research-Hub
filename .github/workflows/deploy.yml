name: Deploy to Sealos

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SEALOS_HOST }}
          username: devbox
          key: ${{ secrets.SEALOS_SSH_KEY }}
          port: ${{ secrets.SEALOS_PORT }}
          script: |
            cd /home/devbox/project
            # 1. 强制更新代码 (如果本地有改动会被覆盖，确保以 GitHub 为准)
            git fetch origin main
            git reset --hard origin/main
            
            # 2. 安装后端依赖并重启
            cd backend
            npm install
            
            # 3. 优雅重启：先启动新进程，再杀掉旧进程（或者直接使用简单的重启）
            # 使用 screen 或 nohup 的改进版，确保进程在 SSH 断开后继续运行
            cd /home/devbox/project/backend
            
            # 杀掉旧进程
            pkill -f "node src/index.js" || true
            
            # 启动新进程，并使用 disown 确保它脱离终端控制
            NODE_ENV=production nohup node src/index.js > output.log 2>&1 & 
            
            sleep 2
            echo "Deployment successful!"
