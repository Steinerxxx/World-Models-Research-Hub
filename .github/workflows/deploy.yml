name: Deploy to Sealos

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SEALOS_HOST }}
          username: devbox
          key: ${{ secrets.SEALOS_SSH_KEY }}
          port: ${{ secrets.SEALOS_PORT }}
          script: |
            cd /home/devbox/project
            # 1. 强制更新代码 (如果本地有改动会被覆盖，确保以 GitHub 为准)
            git fetch origin main
            git reset --hard origin/main
            
            # 2. 安装后端依赖并重启
            cd backend
            npm install
            
            # 3. 运行服务器上的重启脚本
            cd /home/devbox/project/backend
            chmod +x restart.sh
            ./restart.sh
